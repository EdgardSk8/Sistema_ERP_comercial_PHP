  <meta charset="UTF-8">

  <link rel="icon" type="image/png" sizes="32x32" href="/tienda/recursos/img/favicon-navidad.png?v=20261030h">
  <link rel="apple-touch-icon" sizes="180x180" href="/tienda/recursos/img/apple-touch-navidad.png?v=20261030h">

  <meta name="description" content="Accede a tu cuenta de Tellez Nic Store para guardar direcciones, favoritos e historial de compras.">
  <link rel="canonical" href="https://tellezstorenic.pages.dev/login">

  <meta property="og:site_name" content="Tellez Nic Store">
  <meta property="og:locale" content="es_NI">
  <meta property="og:title" content="Iniciar sesión · Tellez Nic Store">
  <meta property="og:description" content="Accede a tu cuenta para guardar direcciones, favoritos e historial de compras.">
  <meta property="og:url" content="https://tellezstorenic.pages.dev/login">
  <meta property="og:image" content="https://tellezstorenic.pages.dev/img/logonavidad.jpg">
  <meta property="og:image:alt" content="Tellez Nic Store">

  <link href="/tienda/recursos/css/base/bootstrap-icons-subset.css?v=20261114a" rel="stylesheet">
  <link rel="stylesheet" href="/tienda/recursos/css/base/estilos.css?v=20261112g">

  <link rel="stylesheet" href="/tienda/recursos/css/base/navidad.css?v=20261108j">

</head>
<body class="pagina-login">

  <header class="app-header">
    <div class="contenedor">
      <a class="icono-btn" href="/tienda" aria-label="Volver">
        <i class="bi bi-arrow-left"></i>
      </a>

      <a class="marca" href="/tienda">
        <img class="marca__logo" src="/tienda/recursos/img/logonavidad-mini.png?v=20261102d" alt="">
        Tellez Nic Store
      </a>

      <div class="header-acciones">
        <a class="icono-btn" href="/tienda/carrito" aria-label="Carrito">
          <i class="bi bi-bag"></i>
          <span class="icono-btn__badge" data-carrito-badge hidden>0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="acceso contenedor">
    <section class="acceso__card acceso__card--login">

      <div class="acceso__marca">
        <img class="acceso__logo" src="/tienda/recursos/img/logonavidad-mini.png?v=20261102d" alt="Tellez Nic Store">
        <h1 class="acceso__titulo">Bienvenido</h1>
        <p class="acceso__texto">
          Inicia sesión o crea una cuenta para guardar tus direcciones,
          favoritos, compras y tu descuento.
        </p>
      </div>

      <div data-chiky class="chiky-montaje"></div>

      <div class="acceso__contenido">
        <div class="acceso__tabs" role="tablist" aria-label="Acceso a la cuenta">
        <button class="acceso__tab is-activo" type="button" id="tabLogin" data-vista="login" role="tab" aria-selected="true" aria-controls="panelLogin" tabindex="0">
          Iniciar sesión
        </button>
        <button class="acceso__tab" type="button" id="tabRegistro" data-vista="registro" role="tab" aria-selected="false" aria-controls="panelRegistro" tabindex="-1">
          Crear cuenta
        </button>
      </div>

      <div class="acceso__paneles">

        <!-- Iniciar sesión -->
        <div class="acceso__panel" id="panelLogin" role="tabpanel" aria-labelledby="tabLogin">
          <form id="formLogin" class="acceso__form">
            <div class="mb-2">
              <label class="form-label" for="loginUsuario">Correo electrónico</label>
              <input class="form-control" id="loginUsuario" name="usuario_cliente" type="email" autocomplete="email" required>
            </div>

            <div class="mb-2">
              <label class="form-label" for="loginPassword">Contraseña</label>
              <input class="form-control" id="loginPassword" name="password" type="password" autocomplete="current-password" required>
            </div>

            <div class="d-flex justify-content-end mt-0 mb-2">
              <a class="small text-decoration-none acceso__recuperar" href="/ayuda">¿Olvidaste tu contraseña?</a>
            </div>

            <button class="btn-primario w-100" type="submit">Entrar</button>

            <div class="acceso__social">
              <div class="acceso__separador"><span>o continúa con</span></div>

              <a class="acceso__social-btn acceso__social-btn--google" href="#" aria-label="Continuar con Google">
                <i class="bi bi-google" aria-hidden="true"></i>
                Google
              </a>
            </div>
          </form>
        </div>

        <!-- Crear cuenta -->
        <div class="acceso__panel" id="panelRegistro" hidden role="tabpanel" aria-labelledby="tabRegistro">
          <form id="formRegistro" class="acceso__form">
            <div class="row g-2" id="registroCampos">
              <div class="col-md-6">
                <label class="form-label" for="registroNombre">Nombre completo</label>
                <input class="form-control" id="registroNombre" name="nombre_cliente" maxlength="150" autocomplete="name" required>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="registroCorreo">Correo</label>
                <input class="form-control" id="registroCorreo" name="correo_cliente" type="email" maxlength="100" autocomplete="email" required>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="registroPassword">Contraseña</label>
                <input class="form-control" id="registroPassword" name="password" type="password" autocomplete="new-password" required>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="registroPasswordConfirm">Confirmar contraseña</label>
                <input class="form-control" id="registroPasswordConfirm" name="password_confirmation" type="password" autocomplete="new-password" required>
              </div>
            </div>

            <button class="btn-primario w-100 mt-2" type="submit">Crear cuenta</button>

            <p class="acceso__legal">
              Al crear tu cuenta aceptas nuestros
              <a href="/tienda/terminos">términos y condiciones</a>.
            </p>

            <div class="acceso__social">
              <div class="acceso__separador"><span>o regístrate con</span></div>

              <a class="acceso__social-btn acceso__social-btn--google" href="#" aria-label="Registrarse con Google">
                <i class="bi bi-google" aria-hidden="true"></i>
                Google
              </a>
            </div>
          </form>
        </div>

      </div>

      <a class="acceso__volver" href="/tienda">
        <i class="bi bi-arrow-left"></i> Volver a la tienda
      </a>
      </div>
    </section>
  </main>

  <script src="/tienda/recursos/js/core/carrito-store.js?v=20261109d" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="/tienda/recursos/js/core/supabase-config.js?v=20261107c" defer></script>
  <script src="/tienda/recursos/js/core/supabase-api.js?v=20261113a" defer></script>
  <script src="/tienda/recursos/js/components/chiky.js?v=20261111d" defer></script>
  <script src="/tienda/recursos/js/pages/login.js?v=20261111c" defer></script>
</body>
</html>
