<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5EEDE">
  <title>Mi carrito · Tellez Nic Store</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/tienda/recursos/css/estilos.css">
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="contenedor">
      <a class="icono-btn" href="/tienda" aria-label="Volver">
        <i class="bi bi-arrow-left"></i>
      </a>

      <a class="marca" href="/tienda">
        <img class="marca__logo" src="/tienda/recursos/img/minilogo.png" alt="">
        Tellez Nic Store
      </a>

      <div class="header-acciones">
        <a class="icono-btn" href="/tienda/carrito" aria-label="Carrito">
          <i class="bi bi-bag"></i>
          <span class="icono-btn__badge" data-carrito-badge hidden>0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="contenedor carrito">

    <div class="carrito__cabecera">
      <h1 class="carrito__titulo">Mi carrito</h1>
      <span class="carrito__unidades" id="carritoUnidades"></span>
    </div>

    <!-- Lista de artículos -->
    <section id="carritoLista" aria-live="polite"></section>

    <!-- Estado vacío -->
    <div class="carrito-vacio" id="carritoVacio" hidden>
      <i class="bi bi-bag"></i>
      <h2>Tu carrito está vacío</h2>
      <p>Explora el catálogo y agrega tus favoritos.</p>
      <a class="btn-primario" href="/tienda#catalogo">Ver productos</a>
    </div>

    <!-- Resumen -->
    <aside class="resumen" id="carritoResumen" hidden>
      <h2 class="resumen__titulo">Resumen del pedido</h2>

      <div class="resumen__fila">
        <span>Subtotal</span>
        <span id="carritoSubtotal">C$ 0.00</span>
      </div>
      <div class="resumen__fila">
        <span>Envío</span>
        <span class="resumen__gratis">Gratis</span>
      </div>

      <div class="resumen__fila resumen__fila--total">
        <span>Total</span>
        <span id="carritoTotal">C$ 0.00</span>
      </div>

      <button type="button" class="btn-primario resumen__btn" id="btnFinalizar">
        Finalizar compra
      </button>
      <button type="button" class="resumen__vaciar" id="btnVaciar">
        Vaciar carrito
      </button>
    </aside>
  </main>

  <script src="/tienda/recursos/js/carrito-store.js"></script>
  <script src="/tienda/recursos/js/carrito-vista.js"></script>
</body>
</html>
